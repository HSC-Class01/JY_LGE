<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="LG전자 2010년 이후 OpenDART 재무분석 대시보드">
  <title>LG전자 재무 인사이트</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a50034'/%3E%3Cpath d='M8 8h5v11h11v5H8z' fill='white'/%3E%3Ccircle cx='21' cy='11' r='4' fill='%23ffb3c8'/%3E%3C/svg%3E">
  <script src="dashboard-config.js"></script>
  <style>
    :root{--ink:#17171a;--muted:#6d6b72;--red:#a50034;--pink:#f7dce5;--line:#e8e4e6;--paper:#fff;--wash:#f7f5f4;--green:#08785c;--amber:#9b5c00;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}button,select{font:inherit}a{color:inherit}.shell{max-width:1220px;margin:auto;padding:28px 22px 70px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:34px;height:34px;border-radius:11px;background:var(--red);display:grid;place-items:center;color:#fff}.nav{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 14px;text-decoration:none;font-size:13px}.pill.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .hero{display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:end;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:800}.hero h1{font-size:clamp(38px,6vw,72px);line-height:1.02;letter-spacing:-.065em;margin:10px 0 16px;max-width:780px}.hero p{margin:0;max-width:650px;color:var(--muted);line-height:1.65}.control{text-align:right}.control label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.control select{padding:12px 38px 12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
    .notice{display:none;border:1px solid #efc36f;background:#fff8e8;color:#744500;border-radius:14px;padding:14px 16px;margin:0 0 20px;line-height:1.55}.notice.show{display:block}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}.card{padding:20px;min-height:143px}.card .label{font-size:13px;color:var(--muted)}.card .value{font-size:clamp(23px,3vw,34px);font-weight:800;letter-spacing:-.045em;margin:18px 0 8px}.delta{font-size:12px;color:var(--green)}.delta.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:14px}.panel{padding:24px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.panel h2{font-size:16px;margin:0;letter-spacing:-.02em}.unit{font-size:11px;color:var(--muted)}#trend{width:100%;height:285px;display:block}.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:8px}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:6px}.dot.red{background:var(--red)}.dot.gray{background:#b9b4b7}
    .ratios{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ratio{border-bottom:1px solid var(--line);padding:12px 0}.ratio:nth-last-child(-n+2){border-bottom:0}.ratio span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.ratio strong{font-size:19px}
    .table-panel{margin-top:14px;overflow:hidden}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}tbody tr:last-child td{border-bottom:0}.foot{display:flex;justify-content:space-between;gap:18px;margin-top:26px;color:var(--muted);font-size:12px;line-height:1.65}.foot p{margin:0}.status{display:inline-flex;align-items:center;gap:7px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
    @media(max-width:900px){.hero,.grid{grid-template-columns:1fr}.control{text-align:left}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:20px 14px 48px}.top{align-items:flex-start}.nav{justify-content:flex-end}.pill{padding:8px 10px}.hero{margin-bottom:20px}.cards{grid-template-columns:1fr 1fr}.card{padding:16px;min-height:125px}.panel{padding:18px}.foot{display:block}.foot p+ p{margin-top:10px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark">L</span><span>LGE Financial Lens</span></div><nav class="nav"><a class="pill" id="dart-link" target="_blank" rel="noreferrer">DART 원문</a><a class="pill primary" id="repo-link" target="_blank" rel="noreferrer">GitHub 저장소</a></nav></header>
    <section class="hero"><div><div class="eyebrow">OpenDART · Consolidated</div><h1>사업의 흐름을<br>재무로 읽다.</h1><p id="basis">재무 데이터 불러오는 중…</p></div><div class="control"><label for="period">분석 기간</label><select id="period"></select></div></section>
    <div class="notice" id="notice"></div>
    <section class="cards" id="cards"></section>
    <div class="grid"><section class="panel"><div class="panel-head"><h2>매출 · 영업이익 추이</h2><span class="unit">단위: 조원</span></div><svg id="trend" role="img" aria-label="연간 매출과 영업이익 추이"></svg><div class="legend"><span><i class="dot red"></i>매출</span><span><i class="dot gray"></i>영업이익</span></div></section><section class="panel"><div class="panel-head"><h2>핵심 재무비율</h2><span class="unit" id="ratio-period"></span></div><div class="ratios" id="ratios"></div></section></div>
    <section class="panel table-panel"><div class="panel-head"><h2>연간 재무 하이라이트</h2><span class="unit">단위: 억원, %</span></div><div class="scroll"><table><thead id="financial-head"></thead><tbody id="financial-body"></tbody></table></div></section>
    <section class="panel table-panel"><div class="panel-head"><h2>연간 재무비율 전체 보기</h2><span class="unit">단위: %, 배, 일</span></div><div class="scroll"><table><thead id="ratio-head"></thead><tbody id="ratio-body"></tbody></table></div></section>
    <footer class="foot"><p><span class="status">데이터 기준 <b id="updated">—</b></span><br>매월 1일 자동 확인 · OpenDART 공시 기준</p><p>ROA·ROE·회전율은 평균 잔액과 기간 연환산을 적용합니다.<br>본 자료는 정보 제공용이며 투자 권유가 아닙니다.</p></footer>
  </main>
  <script>
  const cfg=window.LGE_DASHBOARD_CONFIG||{}, $=s=>document.querySelector(s);
  const won=n=>n==null?'—':`${(n/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0})}억`;
  const trillion=n=>n==null?0:n/1e12, pct=n=>n==null?'—':`${n.toFixed(1)}%`, times=n=>n==null?'—':`${n.toFixed(2)}x`, days=n=>n==null?'—':`${n.toFixed(1)}일`;
  async function loadData(){let last;for(const url of (cfg.dataUrls||['data/dashboard.json'])){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){const d=await r.json();if(d.annual_financials?.length)return d;last=Error('데이터가 비어 있습니다.')}}catch(e){last=e}}throw last||Error('데이터를 불러오지 못했습니다.')}
  function trend(rows){const svg=$('#trend'),w=760,h=285,p={l:34,r:16,t:18,b:36};svg.setAttribute('viewBox',`0 0 ${w} ${h}`);if(!rows.length){svg.innerHTML='';return}const max=Math.max(...rows.flatMap(r=>[r.revenue||0,Math.max(0,r.operating_income||0)]))*1.12||1,x=i=>p.l+i*(w-p.l-p.r)/Math.max(1,rows.length-1),y=v=>p.t+(h-p.t-p.b)*(1-v/max),path=key=>rows.map((r,i)=>`${i?'L':'M'}${x(i)},${y(r[key]||0)}`).join(' ');let html='';for(let i=0;i<4;i++){const yy=p.t+i*(h-p.t-p.b)/3;html+=`<line x1="${p.l}" y1="${yy}" x2="${w-p.r}" y2="${yy}" stroke="#eee9eb"/><text x="0" y="${yy+4}" font-size="10" fill="#8a8589">${(max*(1-i/3)/1e12).toFixed(0)}</text>`}html+=`<path d="${path('revenue')}" fill="none" stroke="#a50034" stroke-width="4" stroke-linecap="round"/><path d="${path('operating_income')}" fill="none" stroke="#aaa4a7" stroke-width="3" stroke-linecap="round"/>`;rows.forEach((r,i)=>{html+=`<circle cx="${x(i)}" cy="${y(r.revenue)}" r="4" fill="#a50034"/><text x="${x(i)}" y="${h-9}" text-anchor="middle" font-size="11" fill="#6d6b72">${r.year}</text>`});svg.innerHTML=html}
  function render(d){const fs=d.annual_financials,rs=d.annual_ratios;$('#basis').textContent=d.basis;$('#dart-link').href=d.source.report_url;$('#repo-link').href=cfg.repositoryUrl||'https://github.com/HSC-Class01/JY_LGE';$('#updated').textContent=d.updated_at||'—';$('#period').innerHTML=fs.map((r,i)=>`<option value="${i}" ${i===fs.length-1?'selected':''}>${r.year} 사업보고서</option>`).join('');trend(fs);
    const draw=i=>{const f=fs[i],r=rs[i]||{},prev=rs[i-1]||{};$('#cards').innerHTML=[['매출액',won(f.revenue),`전년 대비 ${pct(r.revenue_growth_pct)}`],['영업이익',won(f.operating_income),`영업이익률 ${pct(r.operating_margin_pct)}`],['당기순이익',won(f.net_income),`순이익률 ${pct(r.net_margin_pct)}`],['잉여현금흐름',won(r.free_cash_flow),`CFO 마진 ${pct(r.cfo_margin_pct)}`]].map((x,j)=>`<article class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="delta ${j&&r.revenue_growth_pct==null?'muted':''}">${x[2]}</div></article>`).join('');$('#ratio-period').textContent=`${f.year}년`;const ratios=[['매출총이익률',pct(r.gross_margin_pct)],['ROE',pct(r.roe_pct)],['유동비율',pct(r.current_ratio_pct)],['부채비율',pct(r.debt_to_equity_pct)],['자산회전율',times(r.asset_turnover_x)],['DSO',days(r.dso_days)],['CFO 전환율',pct(r.cfo_conversion_pct)],['FCF 마진',pct(r.fcf_margin_pct)]];$('#ratios').innerHTML=ratios.map(x=>`<div class="ratio"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')};$('#period').onchange=e=>draw(Number(e.target.value));draw(fs.length-1);
    const headers='<tr><th>항목</th>'+fs.map(r=>`<th>${r.year}</th>`).join('')+'</tr>';$('#financial-head').innerHTML=headers;const lines=[['매출액','revenue',won],['매출원가','cost_of_sales',won],['매출총이익','gross_profit',won],['영업이익','operating_income',won],['법인세비용차감전순이익','profit_before_tax',won],['당기순이익','net_income',won],['유동자산','current_assets',won],['자산총계','total_assets',won],['현금및현금성자산','cash_and_cash_equivalents',won],['매출채권','accounts_receivable',won],['재고자산','inventory',won],['유동부채','current_liabilities',won],['부채총계','total_liabilities',won],['자본총계','total_equity',won],['단기차입금','short_term_borrowings',won],['장기차입금','long_term_borrowings',won],['영업활동현금흐름','operating_cash_flow',won],['투자활동현금흐름','investing_cash_flow',won],['재무활동현금흐름','financing_cash_flow',won],['유형자산 취득','capex_ppe',won],['무형자산 취득','capex_intangibles',won]];$('#financial-body').innerHTML=lines.map(([label,key,fmt])=>`<tr><td>${label}</td>${fs.map(r=>`<td>${fmt(r[key])}</td>`).join('')}</tr>`).join('');$('#ratio-head').innerHTML=headers;const ratioLines=[['매출 성장률','revenue_growth_pct',pct],['매출총이익률','gross_margin_pct',pct],['영업이익률','operating_margin_pct',pct],['순이익률','net_margin_pct',pct],['ROA','roa_pct',pct],['ROE','roe_pct',pct],['유동비율','current_ratio_pct',pct],['당좌비율','quick_ratio_pct',pct],['부채/자산','debt_ratio_pct',pct],['부채비율','debt_to_equity_pct',pct],['자기자본비율','equity_ratio_pct',pct],['차입금','borrowings',won],['순차입금','net_debt',won],['자산회전율','asset_turnover_x',times],['재고자산회전율','inventory_turnover_x',times],['매출채권회수기간','dso_days',days],['CFO 마진','cfo_margin_pct',pct],['CFO 전환율','cfo_conversion_pct',pct],['CAPEX','capex',won],['잉여현금흐름','free_cash_flow',won],['FCF 마진','fcf_margin_pct',pct]];$('#ratio-body').innerHTML=ratioLines.map(([label,key,fmt])=>`<tr><td>${label}</td>${rs.map(r=>`<td>${fmt(r[key])}</td>`).join('')}</tr>`).join('')}
  loadData().then(render).catch(()=>{const n=$('#notice');n.classList.add('show');n.innerHTML='<b>초기 설정이 필요합니다.</b> GitHub 저장소에 <code>DART_API_KEY</code>를 등록한 뒤 Actions에서 수집 작업을 한 번 실행하세요.';$('#basis').textContent='API 키 등록 후 2010년 이후 실제 연결 재무제표가 표시됩니다.';$('#cards').innerHTML=['매출액','영업이익','당기순이익','잉여현금흐름'].map(x=>`<article class="card"><div class="label">${x}</div><div class="value">—</div><div class="delta muted">데이터 수집 대기</div></article>`).join('');$('#period').innerHTML='<option>설정 대기</option>';$('#dart-link').href='https://dart.fss.or.kr/api/companyRSS.xml?crpCd=00401731';$('#repo-link').href=cfg.repositoryUrl||'https://github.com/HSC-Class01/JY_LGE';$('#updated').textContent='설정 대기'});
  </script>
</body>
</html>
